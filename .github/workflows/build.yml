name: Build APK (Debug)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10.4.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true

      - name: Install node dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web for production
        run: pnpm build

      - name: Setup Android gradle wrapper
        working-directory: ./android
        run: |
          chmod +x gradlew
          ls -la gradlew

      - name: Verify Web Build Output
        run: |
          echo "=== Verifying Web Build ==="
          if [ -f dist/public/index.html ]; then
            echo "✅ Web build output exists"
            ls -lh dist/public/
          else
            echo "❌ Missing dist/public/index.html"
            exit 1
          fi

      - name: Build Debug APK
        working-directory: ./android
        run: ./gradlew assembleDebug --stacktrace -q
        env:
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}

      - name: Check for APK
        run: |
          echo "=== Checking APK Output ==="
          APK_PATH="android/app/build/outputs/apk/debug/app-debug.apk"
          
          if [ -f "$APK_PATH" ]; then
            SIZE=$(ls -lh "$APK_PATH" | awk '{print $5}')
            echo "✅ APK found! Size: $SIZE"
            ls -lh "$APK_PATH"
          else
            echo "❌ APK not found at $APK_PATH"
            echo ""
            echo "=== Contents of build output directory ==="
            find android/app/build -type f -name "*.apk" 2>/dev/null || echo "No APK files found"
            find android/app/build -type f -name "*.aab" 2>/dev/null || echo "No AAB files found"
            
            echo ""
            echo "=== Gradle output directory ==="
            ls -la android/app/build/outputs/ 2>/dev/null || echo "No outputs directory"
            exit 1
          fi

      - name: Upload APK if exists
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: warn
