name: Build APK (Debug)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10.4.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true

      - name: Install Required Android SDK Components
        run: |
          echo "Installing Android SDK components..."
          $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --install "platforms;android-34" "build-tools;34.0.0" 2>&1 || true
          echo "SDK components ready"

      - name: Install node dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web for production
        run: pnpm build

      - name: Setup Android gradle wrapper
        working-directory: ./android
        run: |
          chmod +x gradlew
          ls -la gradlew

      - name: Create local.properties
        working-directory: ./android
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          echo "=== local.properties ==="
          cat local.properties
          echo ""
          echo "=== Android SDK Directory ==="
          ls -la $ANDROID_SDK_ROOT/ | head -15

      - name: Verify Web Build Output
        run: |
          echo "=== Verifying Web Build ==="
          if [ -f dist/public/index.html ]; then
            echo "✅ Web build output exists"
            ls -lh dist/public/
          else
            echo "❌ Missing dist/public/index.html"
            exit 1
          fi

      - name: Build Debug APK
        working-directory: ./android
        run: |
          echo "=== Starting Gradle Build ==="
          ./gradlew assembleDebug --stacktrace --info 2>&1 | tee build.log
          echo "Build completed"
        env:
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}

      - name: Check for APK
        run: |
          echo "=== Checking APK Output ==="
          APK_PATH="android/app/build/outputs/apk/debug/app-debug.apk"
          
          if [ -f "$APK_PATH" ]; then
            SIZE=$(ls -lh "$APK_PATH" | awk '{print $5}')
            echo "✅ APK found! Size: $SIZE"
            ls -lh "$APK_PATH"
          else
            echo "❌ APK not found at $APK_PATH"
            echo ""
            echo "=== Checking build directory ==="
            find android/app/build -type d -name "outputs" 2>/dev/null || echo "No outputs directory found"
            echo ""
            echo "=== Last 50 lines of build.log ==="
            tail -50 android/build.log 2>/dev/null || echo "No build.log found"
            exit 1
          fi

      - name: Upload APK if exists
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: warn
